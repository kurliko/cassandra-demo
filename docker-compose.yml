# Klaster Apache Cassandra: 3 węzły, 1 centrum danych (dc1)

x-cassandra: &cassandra
  image: cassandra:5.0            
  mem_limit: 1536m                
  environment: &env
    CASSANDRA_CLUSTER_NAME: demo-cluster
    CASSANDRA_SEEDS: cass1
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_NUM_TOKENS: 16      
    MAX_HEAP_SIZE: 512M           
    HEAP_NEWSIZE: 128M
    JVM_EXTRA_OPTS: >-
      -Dcassandra.skip_wait_for_gossip_to_settle=0
      -Dcassandra.ring_delay_ms=5000
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' > /dev/null"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 60s

services:
  cass1:                         
    <<: *cassandra
    container_name: cass1
    hostname: cass1
    ports:
      - "9042:9042"              

  cass2:
    <<: *cassandra
    container_name: cass2
    hostname: cass2
    depends_on:
      cass1:
        condition: service_healthy

  cass3:
    <<: *cassandra
    container_name: cass3
    hostname: cass3
    depends_on:
      cass2:
        condition: service_healthy
